    <h1>О проекте</h1>
    <p>Это простое веб-приложение для конвертации валют.</p>
    <p><b>Как пользоваться:</b></p>
    <p>1. Перейдите на страницу /convert/</p>
    <p>2. Добавьте параметры в URL:<br>
        ?from=USD&to=RUB&amount=100</p>
    <p>Доступные валюты: USD, EUR, RUB.</p>
